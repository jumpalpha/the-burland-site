name: Stamp asset versions

# Runs after every push to main. Updates the ?v= fingerprints on style.css and
# main.js so visitors' browsers always load the newest copies, then rebuilds
# the site if anything changed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: stamp-assets
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp fingerprints
        run: bash scripts/stamp-assets.sh

      - name: Commit and rebuild site if fingerprints changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Fingerprints already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update asset version fingerprints [skip ci]"
          git push
          # Pushes made by this workflow don't start a Pages build on their own.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
